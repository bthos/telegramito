<!doctype html>
<!-- @dsCard group="Brand" name="media-gif" subtitle="GIF: auto-play inline, shimmer-load, full overlay with caption" viewport="1280x480" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GIF · Telegramito</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  .gif {
    width: 240px; height: 200px;
    background:
      radial-gradient(120% 90% at 30% 20%, #ffae3a 0%, #ff5e5b 35%, #b15bef 75%, #1b1f4d 100%);
    position: relative;
    overflow: hidden;
  }
  .gif .splash {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 70% 80%, rgba(76,217,194,.6) 0 18%, transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(255,255,255,.35) 0 8%, transparent 12%),
      radial-gradient(circle at 85% 30%, rgba(255,217,122,.7) 0 10%, transparent 16%);
  }
  .gif .streaks {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.18) 18px 20px);
    mix-blend-mode: overlay;
  }
  .gif-tag {
    position: absolute; left: 8px; top: 8px;
    padding: 2px 7px; border-radius: 10px;
    background: rgba(0,0,0,.55); color:#fff;
    font-size: 10px; font-weight: 700; letter-spacing: .04em;
  }

  /* full preview */
  .gif-full {
    width: 70%; aspect-ratio: 1.3/1;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    background:
      conic-gradient(from 90deg at 50% 50%, #ff5e5b, #ffae3a, #4cd9c2, #5b8def, #b15bef, #ff5e5b);
  }
</style>
</head>
<body>
<div class="card-frame">
  <header class="card-head">
    <div>
      <h1>GIF (animated)</h1>
      <p>MP4 with <code>documentAttributeAnimated</code>. Auto-plays inline, looped, muted. Full view shows it framed with caption + share row.</p>
    </div>
    <div class="schema">documentAttributeAnimated</div>
  </header>

  <div class="states">

    <section class="state" data-kind="preview">
      <div class="state-head"><span class="dot"></span> Preview · auto-play</div>
      <div class="stage" data-side="in">
        <div class="bubble in">
          <div class="media-thumb solo">
            <div class="gif">
              <div class="splash"></div>
              <div class="streaks"></div>
              <div class="gif-tag">GIF</div>
            </div>
          </div>
          <div style="position:absolute; right:10px; bottom:6px; padding:2px 6px; border-radius:10px; background:rgba(0,0,0,.4); color:#fff; font-size:11px;">
            14:38
          </div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="loading">
      <div class="state-head"><span class="dot"></span> Fetching</div>
      <div class="stage" data-side="in">
        <div class="bubble in">
          <div class="media-thumb solo">
            <div class="gif skeleton" style="background-size: 200% 100%;">
              <div class="gif-tag" style="background:rgba(0,0,0,.5);">GIF</div>
              <div class="tg-progress">
                <svg class="ring" viewBox="0 0 42 42">
                  <circle cx="21" cy="21" r="18" />
                  <circle class="bar" cx="21" cy="21" r="18"
                    stroke-dasharray="113.1" stroke-dashoffset="22" />
                </svg>
                <span class="x"></span>
              </div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; padding: 6px 4px 2px; font-size:11px; color: var(--ink-3);">
            <span>820 of 1.1 MB</span><span>14:38</span>
          </div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="full">
      <div class="state-head"><span class="dot"></span> Full view · with caption</div>
      <div class="stage" data-mode="overlay">
        <div style="display:flex; flex-direction:column; align-items:center; gap: 18px;">
          <div class="gif-full">
            <div class="splash"></div>
            <div class="streaks"></div>
            <div class="gif-tag">GIF · LOOP</div>
          </div>
          <div style="color: var(--on-overlay); font-size: 14px; max-width: 80%; text-align:center;">when the build finally goes green</div>
          <div style="display:flex; gap: 22px; color: var(--on-overlay-2);">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 19s-7-4-7-9.5A4.5 4.5 0 018 5a4 4 0 013 1.5A4 4 0 0114 5a4.5 4.5 0 014 4.5C18 15 11 19 11 19z" stroke="currentColor" stroke-width="1.6"/></svg>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11l8-7v4c5 0 7 3 7 8-2-2-4-3-7-3v4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M5 12l4 4 8-10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>

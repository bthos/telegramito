<!doctype html>
<!-- @dsCard group="Brand" name="media-video" subtitle="Video: thumb with play, blur+progress download, scrub player" viewport="1280x480" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Video · Telegramito</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  .video-thumb {
    width: 280px; height: 200px;
    background:
      radial-gradient(80% 80% at 30% 30%, #2c5e88 0%, #0f1f33 65%),
      #0f1f33;
    position: relative;
    overflow: hidden;
  }
  .video-thumb .figure {
    position: absolute; inset: 30% 18% 8% 18%;
    background:
      radial-gradient(50% 60% at 50% 35%, #f4cfa2, transparent 70%),
      linear-gradient(180deg, transparent 30%, #1b3550 70%);
    border-radius: 30% 30% 18% 18%;
    filter: blur(.4px);
  }
  .video-thumb .city {
    position:absolute; left:0; right:0; bottom:0; height:48px;
    background: #0a1422;
    clip-path: polygon(0 50%, 8% 30%, 14% 50%, 22% 18%, 30% 50%, 38% 24%, 48% 50%, 60% 14%, 72% 50%, 82% 30%, 92% 50%, 100% 36%, 100% 100%, 0 100%);
  }
  .video-thumb .lights::before, .video-thumb .lights::after {
    content:''; position: absolute; bottom: 18px;
    width: 4px; height: 4px; border-radius: 50%;
    background: #ffd97a; box-shadow: 14px 0 #ffd97a, 28px -3px #ffd97a, 50px -2px #ffd97a, 76px 1px #ffd97a;
    left: 24px;
  }
  .play-btn {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: grid; place-items: center;
  }
  .play-btn svg { margin-left: 3px; }
  .duration-pill {
    position: absolute; left: 8px; top: 8px;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; display: inline-flex; align-items:center; gap: 4px;
  }

  /* full-view (player) */
  .player {
    width: 92%; aspect-ratio: 16/9;
    background: #000;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .player .frame {
    position: absolute; inset: 0;
    background:
      radial-gradient(80% 80% at 30% 30%, #2c5e88 0%, #0f1f33 65%),
      #0f1f33;
  }
  .player .frame .figure {
    position: absolute; inset: 24% 32% 12% 32%;
    background: radial-gradient(50% 60% at 50% 35%, #f4cfa2, transparent 70%),
      linear-gradient(180deg, transparent 30%, #1b3550 70%);
    border-radius: 30% 30% 18% 18%;
  }
  .player .frame .city {
    position:absolute; left:0; right:0; bottom:0; height:30%;
    background:#0a1422;
    clip-path: polygon(0 50%, 8% 30%, 14% 50%, 22% 18%, 30% 50%, 38% 24%, 48% 50%, 60% 14%, 72% 50%, 82% 30%, 92% 50%, 100% 36%, 100% 100%, 0 100%);
  }
  .player .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 32px 18px 14px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.7));
    color: #fff;
  }
  .player .scrub {
    height: 3px; border-radius: 3px;
    background: rgba(255,255,255,.3); position: relative;
    margin-bottom: 10px;
  }
  .player .scrub .filled { width: 32%; height: 100%; background:#fff; border-radius:3px; }
  .player .scrub .head {
    position:absolute; left: 32%; top: 50%;
    width: 12px; height: 12px; border-radius:50%; background:#fff;
    transform: translate(-50%,-50%);
  }
  .player .row { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .player .pp {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    display: grid; place-items: center;
  }
</style>
</head>
<body>
<div class="card-frame">
  <header class="card-head">
    <div>
      <h1>Video</h1>
      <p>Document with <code>documentAttributeVideo</code>. Plays inline; full view drops into a chrome-less player with scrub bar.</p>
    </div>
    <div class="schema">documentAttributeVideo</div>
  </header>

  <div class="states">

    <section class="state" data-kind="preview">
      <div class="state-head"><span class="dot"></span> Preview · in chat</div>
      <div class="stage" data-side="out">
        <div class="bubble out">
          <div class="media-thumb solo">
            <div class="video-thumb">
              <div class="figure"></div>
              <div class="city"></div>
              <span class="lights"></span>
              <div class="duration-pill">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="#fff"><path d="M2 1l7 4-7 4z"/></svg>
                0:48
              </div>
              <div class="play-btn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="#fff"><path d="M5 3l13 7-13 7z"/></svg>
              </div>
            </div>
          </div>
          <div style="position:absolute; right:10px; bottom:6px; padding:2px 6px; border-radius:10px; background:rgba(0,0,0,.4); color:#fff; font-size:11px; display:flex; align-items:center; gap:3px;">
            14:35
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5l3 3 6-6M6 8l5-6" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="loading">
      <div class="state-head"><span class="dot"></span> Downloading · 64%</div>
      <div class="stage" data-side="in">
        <div class="bubble in">
          <div class="media-thumb solo">
            <div class="video-thumb" style="filter: brightness(.75);">
              <div class="figure"></div>
              <div class="city"></div>
              <div class="duration-pill" style="filter: blur(0);">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="#fff"><path d="M2 1l7 4-7 4z"/></svg>
                0:48 · 8.2 MB
              </div>
              <div class="tg-progress">
                <svg class="ring" viewBox="0 0 42 42">
                  <circle cx="21" cy="21" r="18" />
                  <circle class="bar" cx="21" cy="21" r="18"
                    stroke-dasharray="113.1" stroke-dashoffset="40.7" />
                </svg>
                <span class="x"></span>
              </div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; padding: 6px 4px 2px; font-size:11px; color: var(--ink-3);">
            <span>5.2 of 8.2 MB · 1.4 MB/s</span>
            <span>14:35</span>
          </div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="full">
      <div class="state-head"><span class="dot"></span> Full view · player</div>
      <div class="stage" data-mode="overlay">
        <div class="player">
          <div class="frame">
            <div class="figure"></div>
            <div class="city"></div>
          </div>
          <div class="controls">
            <div class="scrub">
              <div class="filled"></div>
              <div class="head"></div>
            </div>
            <div class="row">
              <div class="pp">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><rect x="3" y="2" width="3" height="10"/><rect x="8" y="2" width="3" height="10"/></svg>
              </div>
              <span style="font-variant-numeric: tabular-nums;">0:15 / 0:48</span>
              <div style="flex:1;"></div>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 7v6h4l5 4V3L7 7H3z" fill="#fff"/></svg>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4h5v2H6v3H4zM16 4v5h-2V6h-3V4zM4 16v-5h2v3h3v2zM16 16h-5v-2h3v-3h2z" fill="#fff"/></svg>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>

<!doctype html>
<!-- @dsCard group="Brand" name="media-geo" subtitle="Geo: map snapshot, shimmer load, full map with sheet" viewport="1280x480" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Geo · Telegramito</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  .map {
    width: 280px; height: 180px;
    background:
      linear-gradient(180deg, #e8f0e4 0%, #d5e6dc 100%);
    position: relative;
    overflow: hidden;
  }
  .map::before {
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(120deg, transparent 47%, #c5d4c8 47% 49%, transparent 49%) 0 0/40px 40px,
      linear-gradient(60deg,  transparent 47%, #c5d4c8 47% 49%, transparent 49%) 0 0/56px 56px;
    opacity: .8;
  }
  .map .road {
    position: absolute; left: -10%; right: -10%; top: 56%;
    height: 6px; background: #fff;
    transform: rotate(-8deg);
    box-shadow: 0 0 0 1px #b9c9be;
  }
  .map .road.cross {
    top: 30%; transform: rotate(72deg); left: 30%;
    width: 280px;
  }
  .map .water {
    position:absolute; right: -20px; bottom: -20px;
    width: 130px; height: 90px; border-radius: 50%;
    background: #b8dbe8;
  }
  .pin {
    position: absolute; left: 50%; top: 48%;
    transform: translate(-50%, -100%);
    width: 28px; height: 36px;
  }
  .pin svg { filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }

  .full-map {
    width: 100%; height: 100%;
    position: relative;
    background: linear-gradient(180deg, #e8f0e4 0%, #d5e6dc 100%);
    overflow: hidden;
  }
  .full-map::before {
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(120deg, transparent 47%, #c5d4c8 47% 49%, transparent 49%) 0 0/80px 80px,
      linear-gradient(60deg,  transparent 47%, #c5d4c8 47% 49%, transparent 49%) 0 0/110px 110px;
  }
  .sheet {
    position: absolute; left: 16px; right: 16px; bottom: 16px;
    background: #fff; border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .sheet .row { display:flex; align-items:center; gap: 12px; }
  .sheet .icn-circle {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--tg-blue); display: grid; place-items: center; flex: none;
  }
</style>
</head>
<body>
<div class="card-frame">
  <header class="card-head">
    <div>
      <h1>Geo (Static location)</h1>
      <p>Single-shot map snapshot with pin. Tap opens full map and a "Get directions" sheet.</p>
    </div>
    <div class="schema">messageMediaGeo</div>
  </header>

  <div class="states">

    <section class="state" data-kind="preview">
      <div class="state-head"><span class="dot"></span> Preview · pin</div>
      <div class="stage" data-side="in">
        <div class="bubble in">
          <div class="media-thumb solo">
            <div class="map">
              <div class="road"></div>
              <div class="road cross"></div>
              <div class="water"></div>
              <div class="pin">
                <svg width="28" height="36" viewBox="0 0 28 36" fill="none">
                  <path d="M14 1c7 0 12 5 12 12 0 9-12 22-12 22S2 22 2 13C2 6 7 1 14 1z" fill="#e2483d"/>
                  <circle cx="14" cy="13" r="5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; padding: 6px 4px 0; font-size:11px; color: var(--ink-3);">15:08</div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="loading">
      <div class="state-head"><span class="dot"></span> Tiles loading</div>
      <div class="stage" data-side="in">
        <div class="bubble in">
          <div class="media-thumb solo">
            <div class="map skeleton" style="background-size:200% 100%;">
              <div class="pin">
                <svg width="28" height="36" viewBox="0 0 28 36" fill="none">
                  <path d="M14 1c7 0 12 5 12 12 0 9-12 22-12 22S2 22 2 13C2 6 7 1 14 1z" fill="#e2483d"/>
                  <circle cx="14" cy="13" r="5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="full">
      <div class="state-head"><span class="dot"></span> Full view · directions sheet</div>
      <div class="stage" data-mode="surface" style="padding: 0;">
        <div class="full-map">
          <div style="position:absolute; left:-5%; right:-5%; top:50%; height:8px; background:#fff; transform: rotate(-6deg); box-shadow: 0 0 0 1px #b9c9be;"></div>
          <div style="position:absolute; left:30%; top:-5%; bottom:-5%; width:8px; background:#fff; transform: rotate(8deg); box-shadow: 0 0 0 1px #b9c9be;"></div>
          <div style="position:absolute; right:-40px; bottom:-40px; width:240px; height:160px; border-radius:50%; background:#b8dbe8;"></div>
          <div class="pin" style="left:50%; top:42%; width:36px; height:46px;">
            <svg width="36" height="46" viewBox="0 0 28 36" fill="none">
              <path d="M14 1c7 0 12 5 12 12 0 9-12 22-12 22S2 22 2 13C2 6 7 1 14 1z" fill="#e2483d"/>
              <circle cx="14" cy="13" r="5" fill="#fff"/>
            </svg>
          </div>
          <div class="sheet">
            <div class="row">
              <div class="icn-circle">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1c4 0 7 3 7 7 0 5-7 9-7 9s-7-4-7-9c0-4 3-7 7-7z" stroke="#fff" stroke-width="1.6"/></svg>
              </div>
              <div style="flex:1;">
                <div style="font-weight:600; font-size:14px;">Pinned location</div>
                <div style="font-size:12px; color: var(--ink-3);">52.5163° N · 13.3777° E</div>
              </div>
              <button style="padding: 8px 14px; border-radius: 999px; background: var(--tg-blue); color: #fff; border: 0; font-weight: 600; font-size: 13px;">Directions</button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>

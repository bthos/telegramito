<!doctype html>
<!-- @dsCard group="Brand" name="media-round-video" subtitle="Round video: circular crop, ring-progress recording, expanded play" viewport="1280x480" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Round video · Telegramito</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  .round {
    width: 200px; height: 200px;
    border-radius: 50%;
    background:
      radial-gradient(60% 60% at 40% 35%, #ffd6b5 0%, #d68a5e 60%, #6b3a26 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .round .silhouette {
    position: absolute; left: 25%; right: 25%; bottom: 0;
    aspect-ratio: 1/1.3;
    background:
      radial-gradient(60% 70% at 50% 30%, #6b3a26 0%, #3d1f12 75%, transparent 78%);
    border-radius: 50% 50% 30% 30%;
  }
  .round .silhouette::after {
    content:''; position: absolute; left: 0; right: 0; bottom: -6%;
    height: 32%;
    background: linear-gradient(180deg, #6b3a26, #3d1f12);
    clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
  }
  .round .ambient {
    position: absolute; inset: -5%;
    background:
      radial-gradient(circle at 75% 20%, rgba(255,217,122,.4), transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(91,141,239,.3), transparent 50%);
  }
  .round-time {
    position: absolute; left: 50%; bottom: 6px;
    transform: translateX(-50%);
    padding: 2px 8px; border-radius: 999px;
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; font-variant-numeric: tabular-nums;
    display: inline-flex; align-items:center; gap:5px;
  }
  .round-time .speaker {
    width: 10px; height: 10px;
  }

  .ring-progress {
    position: absolute; inset: -4px;
    pointer-events: none;
  }
  .ring-progress circle {
    fill: none;
    stroke-width: 3;
  }
  .ring-progress .track { stroke: rgba(255,255,255,.25); }
  .ring-progress .bar   { stroke: #fff; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
</style>
</head>
<body>
<div class="card-frame">
  <header class="card-head">
    <div>
      <h1>Round video (video note)</h1>
      <p>Document with <code>documentAttributeVideo.round_message</code>. Circular crop, no bubble. Plays in place.</p>
    </div>
    <div class="schema">documentAttributeVideo · round_message</div>
  </header>

  <div class="states">

    <section class="state" data-kind="preview">
      <div class="state-head"><span class="dot"></span> Preview · paused</div>
      <div class="stage" data-side="in">
        <div style="display:flex; flex-direction:column; align-items:flex-start; gap:4px;">
          <div class="round">
            <div class="ambient"></div>
            <div class="silhouette"></div>
            <div class="round-time">
              <svg class="speaker" viewBox="0 0 10 10" fill="#fff"><path d="M2 4v2h2l3 2V2L4 4z"/><path d="M8 3a3 3 0 010 4" stroke="#fff" stroke-width="1" fill="none"/></svg>
              0:14
            </div>
          </div>
          <span style="font-size:11px; color: rgba(255,255,255,.85); padding: 0 6px; text-shadow:0 1px 2px rgba(0,0,0,.3);">14:51</span>
        </div>
      </div>
    </section>

    <section class="state" data-kind="loading">
      <div class="state-head"><span class="dot"></span> Recording · circle fills</div>
      <div class="stage" data-side="out">
        <div style="display:flex; flex-direction:column; align-items:center; gap: 14px;">
          <div style="position: relative; width: 200px; height: 200px;">
            <div class="round" style="filter: brightness(.85);">
              <div class="ambient"></div>
              <div class="silhouette"></div>
            </div>
            <svg class="ring-progress" viewBox="0 0 100 100" width="208" height="208" style="left:-4px; top:-4px;">
              <circle class="track" cx="50" cy="50" r="48" />
              <circle class="bar"   cx="50" cy="50" r="48"
                stroke-dasharray="301.6" stroke-dashoffset="180" />
            </svg>
            <div style="position:absolute; left:50%; bottom: 14px; transform: translateX(-50%); padding: 3px 9px; border-radius:999px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; font-variant-numeric:tabular-nums;">0:24 / 1:00</div>
          </div>
          <div style="display:flex; gap:14px;">
            <button style="width:40px; height:40px; border-radius:50%; background:#fff; border:0; display:grid; place-items:center; box-shadow:0 4px 10px rgba(0,0,0,.2);">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="#e2483d"><rect x="3" y="3" width="8" height="8" rx="1"/></svg>
            </button>
            <button style="width:40px; height:40px; border-radius:50%; background: var(--tg-blue); border:0; display:grid; place-items:center; box-shadow:0 4px 10px rgba(51,144,236,.4);">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="full">
      <div class="state-head"><span class="dot"></span> Playing · expanded</div>
      <div class="stage" data-mode="overlay">
        <div style="display:flex; flex-direction:column; align-items:center; gap:18px;">
          <div style="position: relative;">
            <div class="round" style="width: 280px; height: 280px;">
              <div class="ambient"></div>
              <div class="silhouette"></div>
            </div>
            <svg class="ring-progress" viewBox="0 0 100 100" width="288" height="288">
              <circle class="track" cx="50" cy="50" r="48" />
              <circle class="bar"   cx="50" cy="50" r="48"
                stroke-dasharray="301.6" stroke-dashoffset="120" />
            </svg>
          </div>
          <div style="color: var(--on-overlay); font-size: 13px; font-variant-numeric: tabular-nums;">0:09 / 0:14</div>
          <div style="display:flex; gap: 22px; color: var(--on-overlay-2);">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="6" y="5" width="3" height="12" fill="currentColor"/><rect x="13" y="5" width="3" height="12" fill="currentColor"/></svg>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 8v6h4l5 4V4L7 8H3z" stroke="currentColor" stroke-width="1.6"/></svg>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>

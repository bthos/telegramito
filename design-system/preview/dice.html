<!doctype html>
<!-- @dsCard group="Brand" name="media-dice" subtitle="Dice: settled five, tumbling roll, bullseye result" viewport="1280x480" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dice · Telegramito</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  .die {
    width: 110px; height: 110px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 12px 24px rgba(0,0,0,.18), inset 0 -6px 0 rgba(0,0,0,.05);
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 16px;
    gap: 4px;
  }
  .die .pip {
    background: #1b2230;
    border-radius: 50%;
    align-self: center; justify-self: center;
    width: 14px; height: 14px;
  }
  .die.large {
    width: 180px; height: 180px;
    border-radius: 36px;
    padding: 24px;
  }
  .die.large .pip { width: 22px; height: 22px; }

  .die.spinning { animation: tumble .9s ease-in-out infinite; }
  @keyframes tumble {
    0%,100% { transform: rotate(-12deg) translateY(0); }
    50%     { transform: rotate(14deg) translateY(-6px); }
  }

  .target {
    width: 200px; height: 200px;
    border-radius: 50%;
    background:
      radial-gradient(circle, #fff 0 14%, #e2483d 14% 28%, #fff 28% 42%, #2b6cf6 42% 56%, #fff 56% 70%, #1b1b1b 70% 100%);
    position: relative;
    box-shadow: 0 12px 28px rgba(0,0,0,.25);
  }
  .target .arrow {
    position: absolute; left: 30%; top: 30%;
    width: 70px; height: 8px;
    background: linear-gradient(90deg, #2b2b2b 0 70%, #ffae3a 70% 80%, #fff 80% 100%);
    transform-origin: 100% 50%;
    transform: rotate(45deg);
    border-radius: 4px;
  }
  .target .tip {
    position: absolute; left: 50%; top: 50%;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(232,169,59,.3);
    transform: translate(-50%,-50%);
  }
</style>
</head>
<body>
<div class="card-frame">
  <header class="card-head">
    <div>
      <h1>Dice / Animated emoji</h1>
      <p>Animated single-roll outcomes. 🎲 1–6, 🎯 bullseye, 🎰 slots, ⚽ goal, 🏀 score, 🎳 strike. Result is server-set.</p>
    </div>
    <div class="schema">messageMediaDice</div>
  </header>

  <div class="states">

    <section class="state" data-kind="preview">
      <div class="state-head"><span class="dot"></span> Preview · settled (5)</div>
      <div class="stage" data-side="out">
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap: 4px;">
          <div class="die">
            <div class="pip"></div><div></div><div class="pip"></div>
            <div></div><div class="pip"></div><div></div>
            <div class="pip"></div><div></div><div class="pip"></div>
          </div>
          <span style="font-size:11px; color: rgba(255,255,255,.85); padding: 0 6px; text-shadow:0 1px 2px rgba(0,0,0,.3);">15:24</span>
        </div>
      </div>
    </section>

    <section class="state" data-kind="loading">
      <div class="state-head"><span class="dot"></span> Rolling · awaiting result</div>
      <div class="stage" data-side="out">
        <div class="die spinning">
          <div class="pip"></div><div class="pip"></div><div class="pip"></div>
          <div class="pip"></div><div class="pip"></div><div class="pip"></div>
          <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        </div>
      </div>
    </section>

    <section class="state" data-kind="full">
      <div class="state-head"><span class="dot"></span> Full view · 🎯 bullseye</div>
      <div class="stage" data-mode="overlay">
        <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
          <div class="target">
            <div class="arrow"></div>
            <div class="tip"></div>
          </div>
          <div style="color: var(--on-overlay); font-weight:700; font-size:24px;">Bullseye!</div>
          <div style="color: var(--on-overlay-2); font-size:13px;">Sent by you · 15:24</div>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>

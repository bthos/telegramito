<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#dfdbd2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,300;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Telegramito</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html[data-theme="light"] {
        background: #dfdbd2;
      }
      html[data-theme="dark"] {
        background: #1a1816;
      }
    </style>
    <script>
      try {
        var k = "telegramito-theme",
          s = localStorage.getItem(k) || "system",
          r = s;
        if (r === "system")
          r = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", r);
        document.documentElement.style.colorScheme = r;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", r === "dark" ? "#1a1816" : "#dfdbd2");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
